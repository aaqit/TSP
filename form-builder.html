<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Form Builder - TSP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1a6b3c;--primary-dark:#0d4a25;--primary-light:#e8f5e9;--danger:#dc3545;--warning:#ff9800;--success:#28a745;--bg:#f0f2f5;--card:#fff;--text:#333;--text-light:#666;--border:#e0e0e0;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;max-width:500px;margin:0 auto}
.hdr{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.menubtn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:8px}
.hdr h1{font-size:18px;font-weight:700;flex:1}
.content{padding:20px 16px 100px}
.sbar-ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200}
.sbar{display:none;position:fixed;top:0;left:0;width:280px;height:100%;background:#fff;z-index:300;box-shadow:4px 0 20px rgba(0,0,0,0.15);overflow-y:auto;border-radius:0 14px 14px 0}
.sbar.open{display:block}
.sbar-hdr{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:20px;border-radius:0 14px 0 0}
.sbar-hdr h2{font-size:16px;font-weight:700;margin-bottom:4px}
.sbar-hdr p{font-size:12px;opacity:.8}
.sbar-hdr .rbadge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;font-size:11px;display:inline-block;margin-top:6px}
.sbar-menu{padding:10px 0}
.sbar-menu a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s}
.sbar-menu a:hover,.sbar-menu a.active{background:var(--primary-light);color:var(--primary)}
.sbar-menu a i{width:20px;text-align:center;font-size:16px}
.sbar-ft{padding:15px 20px;border-top:1px solid var(--border);margin-top:10px}
.lbtn{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--danger);text-decoration:none;font-size:14px;font-weight:600;border-top:1px solid var(--border);margin-top:10px}
.lbtn i{width:20px;text-align:center}
.sec{font-size:16px;font-weight:700;color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.fg{margin-bottom:14px}
.fg label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:block}
.fg input,.fg textarea,.fg select{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#f8f9fa}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--primary);background:#fff}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(0.98)}
.btn-sm{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:6px}
.btn-g{background:var(--primary);color:#fff}
.btn-o{background:var(--warning);color:#fff}
.btn-r{background:var(--danger);color:#fff}
.btn-o2{background:var(--border);color:var(--text)}
.qbox{border:2px dashed var(--border);border-radius:12px;padding:12px;margin-bottom:12px;background:#fafafa;position:relative}
.qbox .qhandle{position:absolute;top:8px;right:8px;color:var(--text-light);cursor:move}
.qtype{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--primary);margin-bottom:6px;display:block}
.qimg{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:8px 0;border:1px solid var(--border)}
.qactions{display:flex;gap:8px;margin-top:10px}
.linkbox{background:var(--primary-light);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;word-break:break-all;font-size:13px;display:none}
.linkbox b{color:var(--primary-dark)}
.linkbox .link{color:var(--primary);font-weight:700;font-family:monospace;word-break:break-all}
.empty{text-align:center;padding:40px;color:var(--text-light)}
.empty i{font-size:40px;color:var(--border);margin-bottom:10px}
.flist{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.flist-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.flist-item:last-child{border-bottom:none}
.flist-item .info .t{font-weight:700;color:var(--primary-dark)}
.flist-item .info .s{font-size:12px;color:var(--text-light)}
.flist-item .act .btn-sm{margin-right:0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;display:none}
.toast.err{background:var(--danger)}
.ld{text-align:center;padding:20px;display:none}
.spin{width:40px;height:40px;border:4px solid var(--border);border-top:4px solid var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.qopt{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff}
.qopt input[type=text]{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.sample-btn{width:100%;padding:12px;background:var(--primary-light);color:var(--primary-dark);border:2px solid var(--primary);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
.sample-btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<div class="sbar-ov" id="sbarOv" onclick="closeSbar()"></div>
<div class="sbar" id="sbar">
<div class="sbar-hdr"><h2 id="sName">User</h2><p id="sPhone"></p><span class="rbadge" id="sRole"></span></div>
<div class="sbar-menu" id="sMenu"></div>
<a href="index.html" class="lbtn" onclick="localStorage.removeItem('currentUser')"><i class="fas fa-sign-out-alt"></i> Logout</a>
<div class="sbar-ft"><p><i class="fas fa-code"></i> A.A.Q. Solutions & Outsourcing</p></div>
</div>
<header class="hdr"><button class="menubtn" onclick="openSbar()"><i class="fas fa-bars"></i></button><h1><i class="fas fa-pen-fancy"></i> Form Builder</h1></header>
<div class="content" id="content">

<div class="sec"><i class="fas fa-plus-circle"></i> Naya Form Banayein</div>
<div class="card">
<div class="fg"><label>Form Ka Naam <span style="color:var(--danger)">*</span></label><input type="text" id="formTitle" placeholder="Mera Pehla Form"></div>
<div class="fg"><label>Form Ki Description (Optional)</label><textarea id="formDesc" rows="2" placeholder="Form ke baare mein jankari"></textarea></div>
<div class="fg"><label>Form Ka Rang (Theme Color)</label><input type="color" id="formColor" value="#1a6b3c"></div>

<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
<button class="btn-sm btn-o2" style="width:auto;flex:1;min-width:120px" onclick="addQuestion()"><i class="fas fa-plus"></i> Sawal Jodein</button>

</div>

<div class="linkbox" id="linkBox">
<b>Form Link:</b> <br>
<span class="link" id="formLink"></span><br>
<small>Is link ko kisi ko bhejain, wo kisi bhi browser mein form bharega. Data sirf login ke baad dikhega.</small>
</div>

<button class="btn" style="margin-top:14px" onclick="saveForm()"><i class="fas fa-save"></i> Form Save Karein & Link Banayein</button>
<button class="btn-sm btn-o2" style="width:100%;margin-top:10px;padding:10px" onclick="resetForm()"><i class="fas fa-plus"></i> Naya Form (Reset)</button>
</div>

<div class="sec"><i class="fas fa-list-ul"></i> Banaye Hue Forms</div>
<div class="flist" id="formList">
<div class="empty"><i class="fas fa-inbox"></i><p>Abhi tak koi form nahi banaya gaya</p></div>
</div>

<div class="ld" id="loading"><div class="spin"></div><p>Process ho raha hai...</p></div>
<div class="toast" id="toast"></div>
</div>

<script>
const FC={apiKey:"AIzaSyBx7UCuhxtgXIKmh9ocGUN_MQktsIN610M",authDomain:"information-1d471.firebaseapp.com",projectId:"information-1d471",storageBucket:"information-1d471.appspot.com",messagingSenderId:"489310613218",appId:"1:489310613218:web:e44e61cf16d4b8c106729d"};
if(!firebase.apps.length)firebase.initializeApp(FC);
const db=firebase.firestore();
let CU=null, editingFormId=null;

function reqAuth(){const u=JSON.parse(localStorage.getItem("currentUser")||"null");if(!u||!u.phone){window.location.href="index.html";return null;}CU=u;return u;}
function openSbar(){if(!CU)return;document.getElementById("sName").textContent=CU.name||"User";document.getElementById("sPhone").textContent=CU.phone||"";document.getElementById("sRole").textContent=CU.role==="division_head"?"Division Head":CU.role==="district_head"?"District Head":CU.role==="area_head"?"Area Head":CU.role||"";const m=document.getElementById("sMenu");m.innerHTML=`<a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="structure.html"><i class="fas fa-sitemap"></i> Tanzeemi Structure</a><a href="persons.html"><i class="fas fa-users"></i> People / Zimmedaran</a><a href="departments.html"><i class="fas fa-building"></i> Departments</a><a href="approvals.html"><i class="fas fa-check-double"></i> Approvals</a><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a><a href="form-builder.html" class="active"><i class="fas fa-pen-fancy"></i> Form Builder</a><a href="form-submissions.html"><i class="fas fa-clipboard-list"></i> Form Submissions</a><a href="admin.html"><i class="fas fa-cog"></i> Admin & Settings</a>`;document.getElementById("sbar").classList.add("open");document.getElementById("sbarOv").style.display="block";}
function closeSbar(){document.getElementById("sbar").classList.remove("open");document.getElementById("sbarOv").style.display="none";}
function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className=e?"toast err":"toast";t.style.display="block";setTimeout(()=>t.style.display="none",3000);}

// ---------- Add one question box ----------
function addQuestion(q=null){
const list=document.getElementById("questionList");
if(!list){toast("Error: question list nahi mila",true);return;}
const div=document.createElement("div");
div.className="qbox";
const optsId="opts"+Date.now();

div.innerHTML=`
<div class="qhandle"><i class="fas fa-arrows-alt"></i></div>
<div class="qtype">${q?q.type:"text"}</div>
<div class="fg"><label>Sawal <span style="color:var(--danger)">*</span></label><input type="text" class="qText" placeholder="Sawal likhein" value="${q?(q.text||''):''}"></div>
<div class="fg"><label>Image URL (Optional)</label><input type="text" class="qImg" placeholder="https://example.com/image.jpg" value="${q?(q.img||''):''}"></div>
<div class="fg"><label>Sawal Ka Type</label><select class="qTypeSel"><option value="text">Short Text</option><option value="paragraph">Long Text</option><option value="multiple">Multiple Choice</option></select></div>
<div id="${optsId}"></div>
<div class="qactions"><button class="btn-sm btn-r" onclick="this.closest('.qbox').remove()"><i class="fas fa-trash"></i> Delete</button></div>
`;

list.appendChild(div);
const sel=div.querySelector(".qTypeSel");
sel.value=q?q.type:"text";

// Setup options container
function setupOptions(opts){
const container=document.getElementById(optsId);
if(!container)return;
container.innerHTML="";
if(opts&&opts.length>0){
opts.forEach((o,i)=>{
const od=document.createElement("div");od.className="qopt";
od.innerHTML=`<input type="text" class="qOpt" placeholder="Option ${i+1}" value="${o||''}">`;
container.appendChild(od);
});
}
}

if(q&&q.options){setupOptions(q.options);}

sel.onchange=function(){
const container=document.getElementById(optsId);
container.innerHTML="";
if(this.value==="multiple"){
for(let i=0;i<4;i++){
const od=document.createElement("div");od.className="qopt";
od.innerHTML=`<input type="text" class="qOpt" placeholder="Option ${i+1}" value="">`;
container.appendChild(od);
}
}
};

// Trigger change once if multiple
if(q&&q.type==="multiple"){sel.dispatchEvent(new Event("change"));}
}

// ---------- Auto Create Test Form (Directly saves to Firebase) ----------
// ---------- Local storage helpers ----------
function getLocalForms(){ try{return JSON.parse(localStorage.getItem("tsp_forms")||"[]");}catch(e){return[];} }
function saveLocalForms(arr){ localStorage.setItem("tsp_forms",JSON.stringify(arr)); }
function upsertLocalForm(id,data){
const arr=getLocalForms();
const i=arr.findIndex(f=>f.id===id);
const obj={id,...data};
if(i>=0) arr[i]=obj; else arr.unshift(obj);
saveLocalForms(arr);
return obj;
}

async function autoCreateTestForm(){
try{
document.getElementById("loading").style.display="block";
const title="Customer Feedback Form";
const desc="Hamare services ke baare mein apni rai dein";
const formColor="#2e7d32";
const headerImg="https://images.unsplash.com/photo-1556742049-0cfed4f7a07d?w=400";
const footerImg="https://images.unsplash.com/photo-1497366216548-37526070297c?w=400";
const questions=[
{text:"Aapka naam kya hai?",type:"text",img:"",options:[]},
{text:"Aapki umar kya hai?",type:"text",img:"",options:[]},
{text:"Aapne kahan se suna hamare baare mein?",type:"multiple",img:"https://images.unsplash.com/photo-1434030221681-599fd28ac2b8?w=300",options:["Facebook","Instagram","WhatsApp","Doston se"]},
{text:"Hamari service se kitne khush hain (1-5)?",type:"multiple",img:"",options:["1 - Bahut kharab","2 - Kharab","3 - Theek hai","4 - Achha","5 - Utkrisht"]},
{text:"Kya aap humein doosron ko recommend karenge?",type:"multiple",img:"",options:["Haan","Nahi","Shayad"]},
{text:"Koi aur sujhav ya comment?",type:"paragraph",img:"",options:[]}
];
const data={title,description:desc,formColor,headerImg,footerImg,createdBy:CU.id||CU.uid||"system",createdByName:CU.name||"User",createdAt:new Date().toISOString(),status:"active",questions:questions};
let newId=null;
try{ const ref=await db.collection("forms").add(data); newId=ref.id; }catch(e){}
if(!newId) newId="local_"+Date.now();
upsertLocalForm(newId,data);
editingFormId=newId;
document.getElementById("loading").style.display="none";
toast("Test form save ho gaya! Link neeche dikhai dega.");
showLink(); loadForms();
}catch(e){document.getElementById("loading").style.display="none";toast("Error: "+e.message,true);}
}

// ---------- Collect all questions from UI ----------
function getQuestions(){
const boxes=document.querySelectorAll(".qbox");
const qs=[];
for(let b of boxes){
const textEl=b.querySelector(".qText");
const typeEl=b.querySelector(".qTypeSel");
const imgEl=b.querySelector(".qImg");
if(!textEl||!typeEl||!imgEl)continue;
const text=textEl.value.trim();
const type=typeEl.value;
const img=imgEl.value.trim();
const opts=[];
b.querySelectorAll(".qOpt").forEach(inp=>{if(inp.value.trim())opts.push(inp.value.trim());});
if(!text){toast("Sabhi sawal ka text likhen",true);throw new Error("empty");}
qs.push({text,type,img,options:type==="multiple"?opts:[]});
}
return qs;
}

// ---------- Save form ----------
async function saveForm(){
try{
const title=document.getElementById("formTitle").value.trim();
const desc=document.getElementById("formDesc").value.trim();
if(!title){toast("Form ka naam likhen",true);return;}
let qs=getQuestions();
const formColor=document.getElementById("formColor").value;
const headerImg=document.getElementById("headerImg").value.trim();
const footerImg=document.getElementById("footerImg").value.trim();
const data={title,description:desc,formColor,headerImg,footerImg,createdBy:CU.id||CU.uid||"system",createdByName:CU.name||"User",createdAt:new Date().toISOString(),status:"active",questions:qs};
document.getElementById("loading").style.display="block";
if(editingFormId){
  upsertLocalForm(editingFormId,data);
  if(!String(editingFormId).startsWith("local_")){ try{ await db.collection("forms").doc(editingFormId).update(data); }catch(e){} }
  else { try{ await db.collection("forms").doc(editingFormId).set(data,{merge:true}); }catch(e){} }
  toast("Form update ho gaya!");
}else{
  let newId=null;
  try{ const ref=await db.collection("forms").add(data); newId=ref.id; }catch(e){}
  if(!newId) newId="local_"+Date.now();
  upsertLocalForm(newId,data);
  editingFormId=newId;
  toast("Form save ho gaya! Link neeche dikhai dega.");
}
document.getElementById("loading").style.display="none";
showLink(); loadForms();
}catch(e){document.getElementById("loading").style.display="none";if(e.message!=="empty")toast("Error: "+e.message,true);}
}

function showLink(){
const box=document.getElementById("linkBox");
const span=document.getElementById("formLink");
if(editingFormId){
const link=`${window.location.origin}${window.location.pathname.replace('form-builder.html','')}form-fill.html#${editingFormId}`;
span.textContent=link;
box.style.display="block";
}
}

let allFormsCache=[];
async function loadForms(){
const list=document.getElementById("formList");
list.innerHTML='<div style="text-align:center;padding:10px;color:var(--text-light)"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
try{
let forms=getLocalForms();
try{
  const snap=await db.collection("forms").where("createdBy","==",CU.id||CU.uid).orderBy("createdAt","desc").get();
  snap.forEach(doc=>{ if(!forms.find(f=>f.id===doc.id)) forms.push({id:doc.id,...doc.data()}); });
}catch(e){}
forms.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
allFormsCache=forms;
if(forms.length===0){list.innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>Abhi tak koi form nahi banaya gaya</p></div>';return;}
list.innerHTML="";
forms.forEach(d=>{
const link=`${window.location.origin}${window.location.pathname.replace('form-builder.html','')}form-fill.html#${d.id}`;
list.innerHTML+=`<div class="flist-item"><div class="info"><div class="t">${escapeHtml(d.title||"Form")}</div><div class="s">${escapeHtml(d.description||"")}</div></div><div class="act"><button class="btn-sm btn-o2" onclick="editForm('${d.id}')"><i class="fas fa-edit"></i></button><button class="btn-sm btn-g" onclick="copyLink('${link}')"><i class="fas fa-copy"></i></button><button class="btn-sm btn-r" onclick="deleteForm('${d.id}')"><i class="fas fa-trash"></i></button></div></div>`;
});
}catch(e){list.innerHTML='<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Error loading forms</p></div>';toast("Error: "+e.message,true);}
}

function editForm(id){
const f=allFormsCache.find(x=>x.id===id);
if(!f){toast("Form nahi mila",true);return;}
editingFormId=id;
document.getElementById("formTitle").value=f.title||"";
document.getElementById("formDesc").value=f.description||"";
document.getElementById("formColor").value=f.formColor||"#1a6b3c";
document.getElementById("headerImg").value=f.headerImg||"";
document.getElementById("footerImg").value=f.footerImg||"";
const list=document.getElementById("questionList");
list.innerHTML="";
(f.questions||[]).forEach(q=>addQuestion(q));
showLink();
toast("Form edit mode mein khul gaya. Badlav karke Save karein.");
window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
editingFormId=null;
document.getElementById("formTitle").value="";
document.getElementById("formDesc").value="";
document.getElementById("formColor").value="#1a6b3c";
document.getElementById("headerImg").value="";
document.getElementById("footerImg").value="";
document.getElementById("questionList").innerHTML="";
document.getElementById("linkBox").style.display="none";
toast("Naya form shuru karein");
}
function copyLink(link){navigator.clipboard.writeText(link);toast("Link copy ho gaya!");}
function deleteForm(id){
if(!confirm("Form delete karna chahte hain?"))return;
let arr=getLocalForms().filter(f=>f.id!==id); saveLocalForms(arr);
if(!String(id).startsWith("local_")){ db.collection("forms").doc(id).delete().catch(()=>{}); }
if(editingFormId===id){ editingFormId=null; document.getElementById("linkBox").style.display="none"; }
toast("Deleted"); loadForms();
}

function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}

window.onload=async()=>{if(!reqAuth())return;await loadForms();};
