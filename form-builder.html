<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Form Builder - TSP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f6df5;--pd:#3b5bdb;--pl:#eef2ff;--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e9f2;--danger:#ef4444;--ok:#10b981;--shadow:0 6px 24px rgba(15,23,42,.06);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--pd);font-size:18px}
.topbar .brand i{width:36px;height:36px;background:var(--pl);color:var(--p);border-radius:10px;display:flex;align-items:center;justify-content:center}
.topbar .spacer{flex:1}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-s{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-d{background:#fee2e2;color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.wrap{max-width:980px;margin:24px auto;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.hero{border-top:8px solid var(--p)}
.label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:block}
.input,.textarea,.select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fbfcff;color:var(--text)}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px rgba(79,109,245,.12);background:#fff}
.textarea{resize:vertical;min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.row{grid-template-columns:1fr}.topbar{padding:12px 14px}.wrap{margin:16px auto}}
.section-title{font-size:16px;font-weight:800;margin:8px 0 14px;display:flex;align-items:center;gap:8px;color:#111827}
.qcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.03);position:relative}
.qcard:hover{border-color:#c7d2fe}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.qnum{font-size:12px;font-weight:800;color:var(--p);background:var(--pl);padding:4px 10px;border-radius:999px}
.qactions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--p);border-color:#c7d2fe;background:var(--pl)}
.icon-btn.del:hover{color:var(--danger);background:#fee2e2;border-color:#fecaca}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-row input{flex:1}
.add-opt{margin-top:6px}
.preview-img{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--border);margin-top:10px;display:none}
.link-box{background:var(--pl);border:1px dashed #c7d2fe;border-radius:12px;padding:16px;margin-top:14px;display:none}
.link-box .url{font-family:monospace;font-size:13px;color:var(--pd);word-break:break-all;margin:8px 0}
.forms-list .item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:12px}
.forms-list .item:last-child{border-bottom:none}
.forms-list .meta{font-size:12px;color:var(--muted);margin-top:3px}
.forms-list .title{font-weight:700}
.forms-list .actions{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:999;display:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.err{background:var(--danger)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty i{font-size:34px;color:#cbd5e1;display:block;margin-bottom:10px}
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:16px;background:var(--p);color:#fff;border:none;font-size:22px;box-shadow:0 10px 30px rgba(79,109,245,.35);cursor:pointer;z-index:40}
.small-muted{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><i class="fas fa-clipboard-list"></i> <span>TSP Form Builder</span></div>
  <div class="spacer"></div>
  <button class="btn btn-s btn-sm" onclick="location.href='dashboard.html'"><i class="fas fa-arrow-left"></i> Dashboard</button>
</div>

<div class="wrap">
  <div class="card hero">
    <div class="section-title"><i class="fas fa-pen" style="color:var(--p)"></i> Form Details</div>
    <div style="margin-bottom:14px">
      <label class="label">Form Title *</label>
      <input class="input" id="formTitle" placeholder="Untitled Form" style="font-size:20px;font-weight:700">
    </div>
    <div style="margin-bottom:14px">
      <label class="label">Description</label>
      <textarea class="textarea" id="formDesc" placeholder="Form ka description likhein..."></textarea>
    </div>
    <div class="row">
      <div>
        <label class="label">Theme Color</label>
        <input type="color" id="formColor" value="#4f6df5" class="input" style="height:46px;padding:6px">
      </div>
      <div>
        <label class="label">Submit Ke Baad Message</label>
        <input class="input" id="successMsg" placeholder="Aapka form safaltapurvak submit ho gaya! Dhanyavad.">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div>
        <label class="label">Form Logo (Optional)</label>
        <input type="file" id="logoImgFile" accept="image/*" class="input" onchange="handleImgUpload(this,'logoImg','logoPrev')">
        <input type="hidden" id="logoImg">
        <img id="logoPrev" class="preview-img" style="max-height:100px;max-width:100px;object-fit:contain">
        <button type="button" class="btn btn-s btn-sm" style="margin-top:8px" onclick="clearImg('logoImg','logoPrev','logoImgFile')">Remove</button>
      </div>
      <div>
        <label class="label">Header Image (Optional)</label>
        <input type="file" id="headerImgFile" accept="image/*" class="input" onchange="handleImgUpload(this,'headerImg','headerPrev')">
        <input type="hidden" id="headerImg">
        <img id="headerPrev" class="preview-img">
        <button type="button" class="btn btn-s btn-sm" style="margin-top:8px" onclick="clearImg('headerImg','headerPrev','headerImgFile')">Remove</button>
      </div>
    </div>
    <div style="margin-top:14px">
      <label class="label">Footer Image (Optional)</label>
      <input type="file" id="footerImgFile" accept="image/*" class="input" onchange="handleImgUpload(this,'footerImg','footerPrev')">
      <input type="hidden" id="footerImg">
      <img id="footerPrev" class="preview-img">
      <button type="button" class="btn btn-s btn-sm" style="margin-top:8px" onclick="clearImg('footerImg','footerPrev','footerImgFile')">Remove</button>
    </div>
  </div>

  <div class="section-title"><i class="fas fa-circle-question" style="color:var(--p)"></i> Questions</div>
  <div id="questionList"></div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn btn-s" onclick="addQuestion()"><i class="fas fa-plus"></i> Sawal Add Karein</button>
    <button class="btn btn-s" onclick="loadSample()"><i class="fas fa-wand-magic-sparkles"></i> Sample Load</button>
  </div>

  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-p" onclick="saveForm()"><i class="fas fa-save"></i> Save Form</button>
      <button class="btn btn-s" onclick="resetForm()"><i class="fas fa-file"></i> Naya Form</button>
    </div>
    <div class="link-box" id="linkBox">
      <div style="font-weight:700;color:var(--pd)"><i class="fas fa-link"></i> Shareable Form Link</div>
      <div class="url" id="formLink"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-p btn-sm" onclick="copyFormLink()"><i class="fas fa-copy"></i> Copy Link</button>
        <button class="btn btn-s btn-sm" onclick="openFormLink()"><i class="fas fa-external-link-alt"></i> Open</button>
      </div>
      <div class="small-muted">Ye link koi bhi browser mein khol sakta hai. Submissions sirf login ke baad dikhenge.</div>
    </div>
  </div>

  <div class="section-title"><i class="fas fa-folder-open" style="color:var(--p)"></i> Aapke Forms</div>
  <div class="card forms-list" id="formList"><div class="empty"><i class="fas fa-inbox"></i>Abhi tak koi form nahi banaya gaya</div></div>
</div>

<button class="fab" onclick="addQuestion()" title="Add Question"><i class="fas fa-plus"></i></button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const FC={apiKey:"AIzaSyBx7UCuhxtgXIKmh9ocGUN_MQktsIN610M",authDomain:"information-1d471.firebaseapp.com",projectId:"information-1d471",storageBucket:"information-1d471.appspot.com",messagingSenderId:"489310613218",appId:"1:489310613218:web:e44e61cf16d4b8c106729d"};
if(!firebase.apps.length)firebase.initializeApp(FC);
const db=firebase.firestore();
let CU=null, editingFormId=null, allFormsCache=[];

function reqAuth(){const u=JSON.parse(localStorage.getItem("currentUser")||"null");if(!u||!u.phone){window.location.href="index.html";return null;}CU=u;return u;}
function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className=e?"toast err":"toast";t.style.display="block";setTimeout(()=>t.style.display="none",2800);}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}

function clearImg(hiddenId,prevId,fileId){document.getElementById(hiddenId).value="";const p=document.getElementById(prevId);p.src="";p.style.display="none";if(fileId)document.getElementById(fileId).value="";}
function handleImgUpload(input,hiddenId,prevId){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const maxW=900; let w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.7);
      document.getElementById(hiddenId).value=data;
      const p=document.getElementById(prevId); p.src=data; p.style.display="block";
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function handleQImg(input){
  const box=input.closest('.qcard'); if(!box) return;
  const hidden=box.querySelector('.qImg'); const prev=box.querySelector('.qPrev');
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const maxW=900; let w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.7);
      hidden.value=data; prev.src=data; prev.style.display="block";
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearQImg(btn){const box=btn.closest('.qcard'); if(!box) return; box.querySelector('.qImg').value=""; const p=box.querySelector('.qPrev'); p.src=""; p.style.display="none"; const f=box.querySelector('.qImgFile'); if(f) f.value="";}

function getLocalForms(){ try{return JSON.parse(localStorage.getItem("tsp_forms")||"[]");}catch(e){return[];} }
function saveLocalForms(arr){ localStorage.setItem("tsp_forms",JSON.stringify(arr)); }
function upsertLocalForm(id,data){ const arr=getLocalForms(); const i=arr.findIndex(f=>f.id===id); const obj={id,...data}; if(i>=0) arr[i]=obj; else arr.unshift(obj); saveLocalForms(arr); return obj; }

function addQuestion(q=null){
  const list=document.getElementById("questionList");
  const div=document.createElement("div");
  div.className="qcard";
  const optsId="opts"+Math.random().toString(36).slice(2);
  div.innerHTML=`
    <div class="qhead">
      <span class="qnum">Question</span>
      <div class="qactions">
        <button class="icon-btn del" onclick="this.closest('.qcard').remove();renumberQuestions()" title="Delete"><i class="fas fa-trash"></i></button>
      </div>
    </div>
    <div style="margin-bottom:12px"><label class="label">Sawal *</label><input class="input qText" placeholder="Sawal likhein..." value="${escapeHtml(q?q.text||'':'')}"></div>
    <div class="row" style="margin-bottom:12px">
      <div>
        <label class="label">Sawal Type</label>
        <select class="select qTypeSel">
          <option value="text">Short Text</option>
          <option value="paragraph">Long Text / Paragraph</option>
          <option value="multiple">Multiple Choice</option>
        </select>
      </div>
      <div>
        <label class="label">Sawal Image (Optional)</label>
        <input type="file" accept="image/*" class="input qImgFile" onchange="handleQImg(this)">
        <input type="hidden" class="qImg" value="${q?(q.img||''):''}">
      </div>
    </div>
    <img class="preview-img qPrev" style="display:${q&&q.img?'block':'none'}" src="${q?(q.img||''):''}">
    <div style="margin-top:8px"><button type="button" class="btn btn-s btn-sm" onclick="clearQImg(this)">Remove Image</button></div>
    <div id="${optsId}" style="margin-top:12px"></div>
  `;
  list.appendChild(div);
  const sel=div.querySelector('.qTypeSel');
  sel.value=q?q.type:'text';

  function renderOpts(opts){
    const container=document.getElementById(optsId); if(!container) return;
    container.innerHTML='';
    if(sel.value!=='multiple') return;
    const listOpts=(opts&&opts.length)?opts:['',''];
    listOpts.forEach((o,i)=>container.appendChild(makeOptRow(o,i+1)));
    const addBtn=document.createElement('button');
    addBtn.type='button'; addBtn.className='btn btn-s btn-sm add-opt'; addBtn.innerHTML='<i class="fas fa-plus"></i> Option Add Karein';
    addBtn.onclick=()=>{ container.insertBefore(makeOptRow('', container.querySelectorAll('.qopt').length+1), addBtn); };
    container.appendChild(addBtn);
  }
  function makeOptRow(val,n){
    const od=document.createElement('div'); od.className='opt-row qopt';
    od.innerHTML=`<input class="input qOpt" placeholder="Option ${n}" value="${escapeHtml(val||'')}"><button type="button" class="icon-btn del" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>`;
    return od;
  }
  sel.onchange=function(){ if(this.value==='multiple') renderOpts([]); else { const c=document.getElementById(optsId); if(c) c.innerHTML=''; } };
  if(q&&q.type==='multiple') renderOpts(q.options||[]);
  renumberQuestions();
}

function renumberQuestions(){ document.querySelectorAll('#questionList .qcard').forEach((c,i)=>{ const n=c.querySelector('.qnum'); if(n) n.textContent='Sawal '+(i+1); }); }

function getQuestions(){
  const boxes=document.querySelectorAll('.qcard'); const qs=[];
  for(const b of boxes){
    const text=b.querySelector('.qText').value.trim();
    const type=b.querySelector('.qTypeSel').value;
    const img=b.querySelector('.qImg').value.trim();
    const opts=[]; b.querySelectorAll('.qOpt').forEach(inp=>{ if(inp.value.trim()) opts.push(inp.value.trim()); });
    if(!text){ toast('Sabhi sawal ka text likhen',true); throw new Error('empty'); }
    qs.push({text,type,img,options:type==='multiple'?opts:[]});
  }
  return qs;
}

async function saveForm(){
  try{
    const title=document.getElementById('formTitle').value.trim();
    if(!title){ toast('Form ka naam likhen',true); return; }
    const qs=getQuestions();
    const data={
      title,
      description:document.getElementById('formDesc').value.trim(),
      formColor:document.getElementById('formColor').value,
      logoImg:document.getElementById('logoImg').value.trim(),
      headerImg:document.getElementById('headerImg').value.trim(),
      footerImg:document.getElementById('footerImg').value.trim(),
      successMsg:document.getElementById('successMsg').value.trim(),
      createdBy:CU.id||CU.uid||'system',
      createdByName:CU.name||'User',
      createdAt:new Date().toISOString(),
      status:'active',
      questions:qs
    };
    if(editingFormId){
      upsertLocalForm(editingFormId,data);
      if(!String(editingFormId).startsWith('local_')){ try{ await db.collection('forms').doc(editingFormId).update(data);}catch(e){} }
      else { try{ await db.collection('forms').doc(editingFormId).set(data,{merge:true}); }catch(e){} }
      toast('Form update ho gaya');
    } else {
      let newId=null;
      try{ const ref=await db.collection('forms').add(data); newId=ref.id; }catch(e){}
      if(!newId) newId='local_'+Date.now();
      upsertLocalForm(newId,data);
      editingFormId=newId;
      toast('Form save ho gaya');
    }
    showLink(); loadForms();
  }catch(e){ if(e.message!=='empty') toast('Error: '+e.message,true); }
}

function showLink(){
  if(!editingFormId) return;
  const link=`${location.origin}${location.pathname.replace('form-builder.html','')}form-fill.html#${editingFormId}`;
  document.getElementById('formLink').textContent=link;
  document.getElementById('linkBox').style.display='block';
}
function copyFormLink(){ const l=document.getElementById('formLink').textContent; if(l) navigator.clipboard.writeText(l); toast('Link copy ho gaya'); }
function openFormLink(){ const l=document.getElementById('formLink').textContent; if(l) window.open(l,'_blank'); }

function editForm(id){
  const f=allFormsCache.find(x=>x.id===id); if(!f){toast('Form nahi mila',true);return;}
  editingFormId=id;
  document.getElementById('formTitle').value=f.title||'';
  document.getElementById('formDesc').value=f.description||'';
  document.getElementById('formColor').value=f.formColor||'#4f6df5';
  document.getElementById('logoImg').value=f.logoImg||'';
  document.getElementById('headerImg').value=f.headerImg||'';
  document.getElementById('footerImg').value=f.footerImg||'';
  document.getElementById('successMsg').value=f.successMsg||'';
  const lp=document.getElementById('logoPrev'); lp.src=f.logoImg||''; lp.style.display=f.logoImg?'block':'none';
  const hp=document.getElementById('headerPrev'); hp.src=f.headerImg||''; hp.style.display=f.headerImg?'block':'none';
  const fp=document.getElementById('footerPrev'); fp.src=f.footerImg||''; fp.style.display=f.footerImg?'block':'none';
  document.getElementById('logoImgFile').value=''; document.getElementById('headerImgFile').value=''; document.getElementById('footerImgFile').value='';
  const list=document.getElementById('questionList'); list.innerHTML='';
  (f.questions||[]).forEach(q=>addQuestion(q));
  showLink(); toast('Edit mode on'); window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingFormId=null;
  document.getElementById('formTitle').value='';
  document.getElementById('formDesc').value='';
  document.getElementById('formColor').value='#4f6df5';
  document.getElementById('logoImg').value=''; document.getElementById('headerImg').value=''; document.getElementById('footerImg').value='';
  document.getElementById('logoImgFile').value=''; document.getElementById('headerImgFile').value=''; document.getElementById('footerImgFile').value='';
  document.getElementById('logoPrev').style.display='none'; document.getElementById('logoPrev').src='';
  document.getElementById('headerPrev').style.display='none'; document.getElementById('headerPrev').src='';
  document.getElementById('footerPrev').style.display='none'; document.getElementById('footerPrev').src='';
  document.getElementById('successMsg').value='';
  document.getElementById('questionList').innerHTML='';
  document.getElementById('linkBox').style.display='none';
  toast('Naya form ready');
}

async function loadForms(){
  const list=document.getElementById('formList');
  list.innerHTML='<div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading...</div>';
  try{
    let forms=getLocalForms();
    try{ const snap=await db.collection('forms').where('createdBy','==',CU.id||CU.uid).orderBy('createdAt','desc').get(); snap.forEach(doc=>{ if(!forms.find(f=>f.id===doc.id)) forms.push({id:doc.id,...doc.data()}); }); }catch(e){}
    forms.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    allFormsCache=forms;
    if(!forms.length){ list.innerHTML='<div class="empty"><i class="fas fa-inbox"></i>Abhi tak koi form nahi banaya gaya</div>'; return; }
    list.innerHTML='';
    forms.forEach(d=>{
      const link=`${location.origin}${location.pathname.replace('form-builder.html','')}form-fill.html#${d.id}`;
      list.innerHTML+=`<div class="item"><div><div class="title">${escapeHtml(d.title||'Untitled Form')}</div><div class="meta">${(d.questions||[]).length} sawal • ${d.createdAt?new Date(d.createdAt).toLocaleDateString('en-GB'):''}</div></div><div class="actions"><button class="btn btn-s btn-sm" onclick="editForm('${d.id}')"><i class="fas fa-pen"></i></button><button class="btn btn-s btn-sm" onclick="navigator.clipboard.writeText('${link}');toast('Link copy ho gaya')"><i class="fas fa-link"></i></button><button class="btn btn-d btn-sm" onclick="deleteForm('${d.id}')"><i class="fas fa-trash"></i></button></div></div>`;
    });
  }catch(e){ list.innerHTML='<div class="empty">Error loading forms</div>'; }
}
function deleteForm(id){
  if(!confirm('Form delete karna chahte hain?')) return;
  saveLocalForms(getLocalForms().filter(f=>f.id!==id));
  if(!String(id).startsWith('local_')) db.collection('forms').doc(id).delete().catch(()=>{});
  if(editingFormId===id) resetForm();
  toast('Form delete ho gaya'); loadForms();
}

function loadSample(){
  resetForm();
  document.getElementById('formTitle').value='Customer Feedback Form';
  document.getElementById('formDesc').value='Kripya neeche diye gaye sawalon ka jawab dein.';
  document.getElementById('formColor').value='#4f6df5';
  document.getElementById('headerImg').value='https://images.unsplash.com/photo-1556742049-0cfed4f7a07d?w=900';
