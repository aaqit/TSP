<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Form Submissions - TSP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1a6b3c;--primary-dark:#0d4a25;--primary-light:#e8f5e9;--danger:#dc3545;--warning:#ff9800;--success:#28a745;--bg:#f0f2f5;--card:#fff;--text:#333;--text-light:#666;--border:#e0e0e0;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;max-width:500px;margin:0 auto}
.hdr{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.menubtn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:8px}
.hdr h1{font-size:18px;font-weight:700;flex:1}
.content{padding:20px 16px 100px}
.sbar-ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200}
.sbar{display:none;position:fixed;top:0;left:0;width:280px;height:100%;background:#fff;z-index:300;box-shadow:4px 0 20px rgba(0,0,0,0.15);overflow-y:auto;border-radius:0 14px 14px 0}
.sbar.open{display:block}
.sbar-hdr{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:20px;border-radius:0 14px 0 0}
.sbar-hdr h2{font-size:16px;font-weight:700;margin-bottom:4px}
.sbar-hdr p{font-size:12px;opacity:.8}
.sbar-hdr .rbadge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;font-size:11px;display:inline-block;margin-top:6px}
.sbar-menu{padding:10px 0}
.sbar-menu a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s}
.sbar-menu a:hover,.sbar-menu a.active{background:var(--primary-light);color:var(--primary)}
.sbar-menu a i{width:20px;text-align:center;font-size:16px}
.sbar-ft{padding:15px 20px;border-top:1px solid var(--border);margin-top:10px}
.lbtn{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--danger);text-decoration:none;font-size:14px;font-weight:600;border-top:1px solid var(--border);margin-top:10px}
.lbtn i{width:20px;text-align:center}
.sec{font-size:16px;font-weight:700;color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.fsel{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#f8f9fa;margin-bottom:14px}
.sub-item{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.sub-item .top{display:flex;justify-content:space-between;align-items:flex-start}
.sub-item .name{font-weight:700;color:var(--primary-dark);font-size:15px}
.sub-item .meta{font-size:12px;color:var(--text-light);display:flex;gap:12px;flex-wrap:wrap}
.sub-item .ans{font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.4}
.sub-item .actions{display:flex;gap:8px;margin-top:6px}
.btn-sm{padding:6px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-g{background:var(--primary);color:#fff}
.btn-r{background:var(--danger);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;display:none}
.toast.err{background:var(--danger)}
.empty{text-align:center;padding:40px;color:var(--text-light)}
.empty i{font-size:40px;color:var(--border);margin-bottom:10px}
.ld{text-align:center;padding:20px;display:none}
.spin{width:40px;height:40px;border:4px solid var(--border);border-top:4px solid var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.link{color:var(--primary);font-weight:700;font-family:monospace;word-break:break-all;font-size:12px}
</style>
</head>
<body>
<div class="sbar-ov" id="sbarOv" onclick="closeSbar()"></div>
<div class="sbar" id="sbar">
<div class="sbar-hdr"><h2 id="sName">User</h2><p id="sPhone"></p><span class="rbadge" id="sRole"></span></div>
<div class="sbar-menu" id="sMenu"></div>
<a href="index.html" class="lbtn" onclick="localStorage.removeItem('currentUser')"><i class="fas fa-sign-out-alt"></i> Logout</a>
<div class="sbar-ft"><p><i class="fas fa-code"></i> A.A.Q. Solutions & Outsourcing</p></div>
</div>
<header class="hdr"><button class="menubtn" onclick="openSbar()"><i class="fas fa-bars"></i></button><h1><i class="fas fa-clipboard-list"></i> Form Submissions</h1></header>
<div class="content" id="content">

<div class="sec"><i class="fas fa-filter"></i> Form Select Karein</div>
<select class="fsel" id="formFilter"><option value="all">Sabhi Forms</option></select>

<div class="sec" id="secTitle"><i class="fas fa-clipboard-list"></i> Submissions <span id="subCount" style="font-size:12px;font-weight:500;color:var(--text-light);margin-left:8px">(0)</span></div>
<div id="subList"></div>

<div class="ld" id="loading"><div class="spin"></div><p>Loading...</p></div>
<div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const FC={apiKey:"AIzaSyBx7UCuhxtgXIKmh9ocGUN_MQktsIN610M",authDomain:"information-1d471.firebaseapp.com",projectId:"information-1d471",storageBucket:"information-1d471.appspot.com",messagingSenderId:"489310613218",appId:"1:489310613218:web:e44e61cf16d4b8c106729d"};
if(!firebase.apps.length)firebase.initializeApp(FC);
const db=firebase.firestore();
let CU=null, allForms=[], allSubs=[];

function reqAuth(){const u=JSON.parse(localStorage.getItem("currentUser")||"null");if(!u||!u.phone){window.location.href="index.html";return null;}CU=u;return u;}
function openSbar(){if(!CU)return;document.getElementById("sName").textContent=CU.name||"User";document.getElementById("sPhone").textContent=CU.phone||"";document.getElementById("sRole").textContent=CU.role==="division_head"?"Division Head":CU.role==="district_head"?"District Head":CU.role==="area_head"?"Area Head":CU.role||"";const m=document.getElementById("sMenu");m.innerHTML=`<a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="structure.html"><i class="fas fa-sitemap"></i> Tanzeemi Structure</a><a href="persons.html"><i class="fas fa-users"></i> People / Zimmedaran</a><a href="departments.html"><i class="fas fa-building"></i> Departments</a><a href="approvals.html"><i class="fas fa-check-double"></i> Approvals</a><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a><a href="form-builder.html"><i class="fas fa-pen-fancy"></i> Form Builder</a><a href="form-submissions.html" class="active"><i class="fas fa-clipboard-list"></i> Form Submissions</a><a href="admin.html"><i class="fas fa-cog"></i> Admin & Settings</a>`;document.getElementById("sbar").classList.add("open");document.getElementById("sbarOv").style.display="block";}
function closeSbar(){document.getElementById("sbar").classList.remove("open");document.getElementById("sbarOv").style.display="none";}
function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className=e?"toast err":"toast";t.style.display="block";setTimeout(()=>t.style.display="none",3000);}

async function load(){
document.getElementById("loading").style.display="block";
try{
const[fsnap,ssnap]=await Promise.all([db.collection("forms").where("createdBy","==",CU.id||CU.uid).orderBy("createdAt","desc").get().catch(()=>({forEach(){}})),db.collection("form_submissions").orderBy("submittedAt","desc").get().catch(()=>({forEach(){}}))]);
allForms=[]; if(fsnap&&fsnap.forEach) fsnap.forEach(doc=>allForms.push({id:doc.id,...doc.data()}));
allSubs=[]; if(ssnap&&ssnap.forEach) ssnap.forEach(doc=>allSubs.push({id:doc.id,...doc.data(),_src:"fb"}));
// Merge localStorage submissions
try{
const local=JSON.parse(localStorage.getItem("tsp_form_subs")||"[]");
local.forEach((s,i)=>{ allSubs.push({...s, id:"local_"+i, _src:"local"}); });
}catch(e){}
allSubs.sort((a,b)=>new Date(b.submittedAt||0)-new Date(a.submittedAt||0));

const sel=document.getElementById("formFilter");
sel.innerHTML='<option value="all">Sabhi Forms</option>';
allForms.forEach(f=>{sel.innerHTML+=`<option value="${f.id}">${escapeHtml(f.title||"Form")}</option>`;});
// Add local form titles if not in forms
const titles=new Set(allForms.map(f=>f.title));
allSubs.forEach(s=>{ if(s.formTitle && !titles.has(s.formTitle) && !allForms.find(f=>f.id===s.formId)){ titles.add(s.formTitle); sel.innerHTML+=`<option value="title:${escapeHtml(s.formTitle)}">${escapeHtml(s.formTitle)}</option>`; }});
render();
document.getElementById("loading").style.display="none";
sel.onchange=render;
}catch(e){document.getElementById("loading").style.display="none";toast("Error: "+e.message,true);}
}

function render(){
const filter=document.getElementById("formFilter").value;
const list=document.getElementById("subList");
const countEl=document.getElementById("subCount");
const secTitle=document.getElementById("secTitle");
let subs=allSubs;
let formName="Sabhi Forms";
if(filter!=="all"){
if(filter.startsWith("title:")){
const t=filter.slice(6);
subs=allSubs.filter(s=>(s.formTitle||"")===t);
formName=t;
}else{
subs=allSubs.filter(s=>s.formId===filter);
const f=allForms.find(x=>x.id===filter);
formName=f?f.title:"Form";
}
}
countEl.textContent=`(${subs.length})`;
secTitle.innerHTML=`<i class="fas fa-clipboard-list"></i> Submissions <span style="font-size:12px;font-weight:500;color:var(--text-light);margin-left:8px">(${subs.length})</span> - ${escapeHtml(formName)}`;
if(subs.length===0){list.innerHTML='<div class="empty"><i class="fas fa-inbox"></i><p>Koi submission nahi hai</p></div>';return;}
list.innerHTML="";
subs.forEach(s=>{
const f=allForms.find(x=>x.id===s.formId);
const dt=s.submittedAt?new Date(s.submittedAt).toLocaleString("en-GB"):"";
let ansHtml="";
for(const[k,v] of Object.entries(s.answers||{})){
ansHtml+=`<div style="font-size:12px;color:var(--text-light);margin-bottom:2px">${escapeHtml(k)}:</div><div style="font-size:13px;color:var(--text);margin-bottom:8px">${escapeHtml(v)}</div>`;
}
const title=f?f.title:(s.formTitle||"Form");
const link=s.formId?`${window.location.origin}${window.location.pathname.replace('form-submissions.html','')}form-fill.html#${s.formId}`:"";
const linkBtn=link?`<button class="btn-sm btn-o" onclick="copyLink('${link}')"><i class="fas fa-link"></i> Form Link</button>`:"";
list.innerHTML+=`<div class="sub-item"><div class="top"><div class="name">${escapeHtml(title)}</div><div style="font-size:11px;color:var(--text-light)">${dt}</div></div><div class="meta"><span><i class="fas fa-clock" style="color:var(--primary)"></i> ${dt}</span>${s._src==="local"?'<span style="color:var(--warning)">(Local)</span>':""}</div><div class="ans">${ansHtml}</div><div class="actions">${linkBtn}<button class="btn-sm btn-r" onclick="deleteSub('${s.id}','${s._src||"fb"}')"><i class="fas fa-trash"></i> Delete</button></div></div>`;
});
}

function copyLink(link){navigator.clipboard.writeText(link);toast("Form link copy ho gaya!");}
function deleteSub(id,src){
if(!confirm("Submission delete karna chahte hain?"))return;
if(src==="local"){
try{
let local=JSON.parse(localStorage.getItem("tsp_form_subs")||"[]");
const idx=parseInt(id.replace("local_",""),10);
if(!isNaN(idx)) local.splice(idx,1);
localStorage.setItem("tsp_form_subs",JSON.stringify(local));
toast("Deleted"); load();
}catch(e){toast("Error: "+e.message,true);}
return;
}
db.collection("form_submissions").doc(id).delete().then(()=>{toast("Deleted");load();}).catch(e=>toast("Error: "+e.message,true));
}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}

window.onload=async()=>{if(!reqAuth())return;await load();};
</script>
</body>
</html>
