<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Form Submissions - TSP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f6df5;--pd:#3b5bdb;--pl:#eef2ff;--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e9f2;--danger:#ef4444;--shadow:0 6px 24px rgba(15,23,42,.06);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--pd);font-size:18px}
.topbar .brand i{width:36px;height:36px;background:var(--pl);color:var(--p);border-radius:10px;display:flex;align-items:center;justify-content:center}
.topbar .spacer{flex:1}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-s{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-d{background:#fee2e2;color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.wrap{max-width:1200px;margin:24px auto;padding:0 16px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.ctrl{flex:1;min-width:220px}
.label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;display:block}
.select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fbfcff}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 20px;min-width:160px;box-shadow:0 2px 10px rgba(15,23,42,.03)}
.stat .n{font-size:28px;font-weight:800;color:var(--pd)}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:#f8faff;color:#334155;font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
tbody tr:hover td{background:#fbfdff}
tbody tr:last-child td{border-bottom:none}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty i{font-size:34px;color:#cbd5e1;display:block;margin-bottom:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:999;display:none}
.toast.err{background:var(--danger)}
@media(max-width:720px){.topbar{padding:12px 14px}.wrap{margin:16px auto}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><i class="fas fa-table"></i> <span>Form Submissions</span></div>
  <div class="spacer"></div>
  <button class="btn btn-s btn-sm" onclick="location.href='dashboard.html'"><i class="fas fa-arrow-left"></i> Dashboard</button>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="n" id="totalCount">0</div><div class="l">Total Submissions</div></div>
    <div class="stat"><div class="n" id="formCount">0</div><div class="l">Forms</div></div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="ctrl">
        <label class="label">Form Select Karein</label>
        <select class="select" id="formFilter"><option value="all">Sabhi Forms</option></select>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-p" onclick="downloadExcel()"><i class="fas fa-file-excel"></i> Download Excel (CSV)</button>
        <button class="btn btn-s" onclick="load()"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
    </div>
  </div>

  <div class="table-wrap" id="tableWrap"><div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading...</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const FC={apiKey:"AIzaSyBx7UCuhxtgXIKmh9ocGUN_MQktsIN610M",authDomain:"information-1d471.firebaseapp.com",projectId:"information-1d471",storageBucket:"information-1d471.appspot.com",messagingSenderId:"489310613218",appId:"1:489310613218:web:e44e61cf16d4b8c106729d"};
if(!firebase.apps.length)firebase.initializeApp(FC);
const db=firebase.firestore();
let CU=null, allForms=[], allSubs=[], currentSubs=[], currentFormName='Sabhi Forms';

function reqAuth(){const u=JSON.parse(localStorage.getItem('currentUser')||'null'); if(!u||!u.phone){location.href='index.html';return null;} CU=u; return u;}
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className=e?'toast err':'toast';t.style.display='block';setTimeout(()=>t.style.display='none',2800);}
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}

async function load(){
  document.getElementById('tableWrap').innerHTML='<div class="empty"><i class="fas fa-spinner fa-spin"></i>Loading...</div>';
  try{
    const [fsnap,ssnap]=await Promise.all([
      (async()=>{ try{ return await db.collection('forms').where('createdBy','==',CU.id||CU.uid).orderBy('createdAt','desc').get(); }catch(e){ try{ return await db.collection('forms').where('createdBy','==',CU.id||CU.uid).get(); }catch(e2){ return {forEach(){}}; } } })(),
      db.collection('form_submissions').orderBy('submittedAt','desc').get().catch(()=>({forEach(){}}))
    ]);
    allForms=[]; if(fsnap&&fsnap.forEach) fsnap.forEach(doc=>allForms.push({id:doc.id,...doc.data()}));
    try{ const localForms=JSON.parse(localStorage.getItem('tsp_forms')||'[]'); localForms.forEach(f=>{ if(f&&f.id && !allForms.find(x=>x.id===f.id)) allForms.push(f); }); }catch(e){}
    allSubs=[]; if(ssnap&&ssnap.forEach) ssnap.forEach(doc=>allSubs.push({id:doc.id,...doc.data(),_src:'fb'}));
    try{ const local=JSON.parse(localStorage.getItem('tsp_form_subs')||'[]'); local.forEach((s,i)=>allSubs.push({...s,id:'local_'+i,_src:'local'})); }catch(e){}
    // dedupe (local + firebase same submission)
    const seen=new Set();
    allSubs=allSubs.filter(s=>{
      const key=s.submissionId || s.id && !String(s.id).startsWith('local_') ? (s.submissionId||s.id) : (s.submissionId || (s.formId+'|'+s.submittedAt+'|'+JSON.stringify(s.answers||{})));
      if(seen.has(key)) return false; seen.add(key); return true;
    });
    allSubs.sort((a,b)=>new Date(b.submittedAt||0)-new Date(a.submittedAt||0));

    const sel=document.getElementById('formFilter');
    const prev=sel.value;
    sel.innerHTML='<option value="all">Sabhi Forms</option>';
    allForms.forEach(f=>sel.innerHTML+=`<option value="${f.id}">${esc(f.title||'Untitled Form')}</option>`);
    const titles=new Set(allForms.map(f=>f.title));
    allSubs.forEach(s=>{ if(s.formTitle && !titles.has(s.formTitle) && !allForms.find(f=>f.id===s.formId)){ titles.add(s.formTitle); sel.innerHTML+=`<option value="title:${esc(s.formTitle)}">${esc(s.formTitle)}</option>`; }});
    if([...sel.options].some(o=>o.value===prev)) sel.value=prev;
    document.getElementById('formCount').textContent=allForms.length;
    render();
  }catch(e){ document.getElementById('tableWrap').innerHTML='<div class="empty">Error loading submissions</div>'; }
}

function getAnswerColumns(subs, form){
  if(form && Array.isArray(form.questions) && form.questions.length) return form.questions.map((q,i)=>({key:`a${i}`,label:q.text||`Sawal ${i+1}`}));
  // try to find matching form from submissions
  if(!form){
    const ids=[...new Set(subs.map(s=>s.formId).filter(Boolean))];
    for(const id of ids){ const f=allForms.find(x=>x.id===id); if(f && Array.isArray(f.questions)&&f.questions.length) return f.questions.map((q,i)=>({key:`a${i}`,label:q.text||`Sawal ${i+1}`})); }
    const titles=[...new Set(subs.map(s=>s.formTitle).filter(Boolean))];
    for(const t of titles){ const f=allForms.find(x=>x.title===t); if(f && Array.isArray(f.questions)&&f.questions.length) return f.questions.map((q,i)=>({key:`a${i}`,label:q.text||`Sawal ${i+1}`})); }
  }
  // fallback: use questionLabels from any submission
  const subWithLabels=subs.find(s=>Array.isArray(s.questionLabels)&&s.questionLabels.length);
  if(subWithLabels){
    const keys=new Set(); subs.forEach(s=>Object.keys(s.answers||{}).forEach(k=>keys.add(k)));
    const arr=Array.from(keys).sort((a,b)=>(parseInt(a.replace(/\D/g,''))||0)-(parseInt(b.replace(/\D/g,''))||0));
    return arr.map((k,idx)=>{ const i=parseInt(k.replace(/\D/g,'')); const label=(Number.isFinite(i)&&subWithLabels.questionLabels[i])?subWithLabels.questionLabels[i]:`Sawal ${idx+1}`; return {key:k,label}; });
  }
  const keys=new Set(); subs.forEach(s=>Object.keys(s.answers||{}).forEach(k=>keys.add(k)));
  return Array.from(keys).sort((a,b)=>(parseInt(a.replace(/\D/g,''))||0)-(parseInt(b.replace(/\D/g,''))||0)).map((k,idx)=>({key:k,label:`Sawal ${idx+1}`}));
}

function render(){
  const filter=document.getElementById('formFilter').value;
  let subs=allSubs, formName='Sabhi Forms', selectedForm=null;
  if(filter!=='all'){
    if(filter.startsWith('title:')){ const t=filter.slice(6); subs=allSubs.filter(s=>(s.formTitle||'')===t); formName=t; selectedForm=allForms.find(f=>f.title===t)||null; }
    else { subs=allSubs.filter(s=>s.formId===filter); selectedForm=allForms.find(f=>f.id===filter)||null; formName=selectedForm?selectedForm.title:'Form'; }
  } else {
    const ids=[...new Set(subs.map(s=>s.formId).filter(Boolean))];
    if(ids.length===1) selectedForm=allForms.find(f=>f.id===ids[0])||null;
  }
  currentSubs=subs; currentFormName=formName;
  document.getElementById('totalCount').textContent=subs.length;
  if(!subs.length){ document.getElementById('tableWrap').innerHTML='<div class="empty"><i class="fas fa-inbox"></i>Koi submission nahi hai</div>'; return; }
  const cols=getAnswerColumns(subs,selectedForm);
  let html=`<table><thead><tr><th>#</th><th>Date/Time</th><th>Form</th>`;
  cols.forEach(c=>html+=`<th>${esc(c.label)}</th>`);
  html+=`<th>Action</th></tr></thead><tbody>`;
  subs.forEach((s,idx)=>{
    const f=allForms.find(x=>x.id===s.formId);
    const dt=s.submittedAt?new Date(s.submittedAt).toLocaleString('en-GB'):'';
    const title=f?f.title:(s.formTitle||'Form');
    html+=`<tr><td>${idx+1}</td><td style="white-space:nowrap">${esc(dt)}</td><td>${esc(title)}</td>`;
    cols.forEach(c=>{ const v=(s.answers&&s.answers[c.key]!=null)?s.answers[c.key]:''; html+=`<td>${esc(String(v))}</td>`; });
    html+=`<td><button class="btn btn-d btn-sm" onclick="deleteSub('${s.id}','${s._src||'fb'}')"><i class="fas fa-trash"></i></button></td></tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('tableWrap').innerHTML=html;
}

function deleteSub(id,src){
  if(!confirm('Submission delete karna chahte hain?')) return;
  if(src==='local'){
    try{ let local=JSON.parse(localStorage.getItem('tsp_form_subs')||'[]'); const idx=parseInt(id.replace('local_',''),10); if(!isNaN(idx)) local.splice(idx,1); localStorage.setItem('tsp_form_subs',JSON.stringify(local)); toast('Deleted'); load(); }catch(e){ toast('Error',true); }
    return;
  }
  db.collection('form_submissions').doc(id).delete().then(()=>{toast('Deleted'); load();}).catch(()=>toast('Error',true));
}

function downloadExcel(){
  const subs=currentSubs||[];
  if(!subs.length){ toast('Koi submission nahi hai',true); return; }
  const filter=document.getElementById('formFilter').value;
  let selectedForm=null;
  if(filter!=='all' && !filter.startsWith('title:')) selectedForm=allForms.find(f=>f.id===filter)||null;
  if(!selectedForm){ const t=filter.startsWith('title:')?filter.slice(6):null; if(t) selectedForm=allForms.find(f=>f.title===t)||null; }
  if(!selectedForm){ const ids=[...new Set(subs.map(s=>s.formId).filter(Boolean))]; if(ids.length===1) selectedForm=allForms.find(f=>f.id===ids[0])||null; }
  const cols=getAnswerColumns(subs,selectedForm);
  const headers=['#','Date/Time','Form',...cols.map(c=>c.label)];
  const rows=subs.map((s,idx)=>{ const f=allForms.find(x=>x.id===s.formId); const dt=s.submittedAt?new Date(s.submittedAt).toLocaleString('en-GB'):''; const title=f?f.title:(s.formTitle||'Form'); const vals=cols.map(c=>String((s.answers&&s.answers[c.key]!=null)?s.answers[c.key]:'')); return [String(idx+1),dt,title,...vals]; });
  const escCSV=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=[headers.map(escCSV).join(','), ...rows.map(r=>r.map(escCSV).join(','))].join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(currentFormName||'submissions').replace(/[^a-z0-9_\- ]/gi,'_')+'_submissions.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Excel (CSV) download ho gaya');
}

document.getElementById('formFilter').addEventListener('change', render);
window.onload=async()=>{ if(!reqAuth()) return; await load(); };
</script>
</body>
</html>
